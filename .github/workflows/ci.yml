name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lilleri
          POSTGRES_PASSWORD: lilleri
          POSTGRES_DB: lilleri_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lilleri"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TZ: Europe/Rome
      PG_TEST_DATABASE_URL: postgres://lilleri:lilleri@localhost:5432/lilleri_test
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome (lint + format)
        run: pnpm exec biome ci .
      - name: Typecheck
        run: pnpm typecheck
      - name: Zero-investment bootstrap and economics
        run: pnpm test:bootstrap
      - name: Unit tests
        run: pnpm test
      - name: Integration tests (PostgreSQL)
        run: pnpm test:integration
      - name: Build
        run: pnpm build

  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit production dependencies (high and above)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true
